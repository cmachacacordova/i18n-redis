name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  VCPKG_HOME: ${{ github.workspace }}/extras/vcpkg
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extras/registry/ports
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extras/registry/triplets

jobs:
  linux-gcc:
    name: Linux / GCC / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc-static-debug
            variant: static-debug [simdjson]
          - preset: linux-gcc-static-debug-yyjson
            variant: static-debug [yyjson]
          - preset: linux-gcc-static-release
            variant: static-release [simdjson]
          - preset: linux-gcc-static-release-yyjson
            variant: static-release [yyjson]
          - preset: linux-gcc-shared-debug
            variant: shared-debug [simdjson]
          - preset: linux-gcc-shared-debug-yyjson
            variant: shared-debug [yyjson]
          - preset: linux-gcc-shared-release
            variant: shared-release [simdjson]
          - preset: linux-gcc-shared-release-yyjson
            variant: shared-release [yyjson]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github/scripts/verify_submodules.sh extras/vcpkg extras/registry

      - name: Install system dependencies
        run: .github/scripts/install_deps_unix.sh gcc

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-gcc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-gcc-

      - name: Bootstrap vcpkg
        run: .github/scripts/bootstrap_vcpkg_unix.sh extras/vcpkg

      - name: Configure
        run: .github/scripts/configure_cmake.sh ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out/build --output-on-failure

  linux-clang:
    name: Linux / Clang / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-debug
            variant: static-debug [simdjson]
          - preset: linux-clang-static-debug-yyjson
            variant: static-debug [yyjson]
          - preset: linux-clang-static-release
            variant: static-release [simdjson]
          - preset: linux-clang-static-release-yyjson
            variant: static-release [yyjson]
          - preset: linux-clang-shared-debug
            variant: shared-debug [simdjson]
          - preset: linux-clang-shared-debug-yyjson
            variant: shared-debug [yyjson]
          - preset: linux-clang-shared-release
            variant: shared-release [simdjson]
          - preset: linux-clang-shared-release-yyjson
            variant: shared-release [yyjson]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github/scripts/verify_submodules.sh extras/vcpkg extras/registry

      - name: Install system dependencies
        run: .github/scripts/install_deps_unix.sh clang

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-clang-

      - name: Bootstrap vcpkg
        run: .github/scripts/bootstrap_vcpkg_unix.sh extras/vcpkg

      - name: Configure
        run: .github/scripts/configure_cmake.sh ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out/build --output-on-failure

  linux-clang-sanitizers:
    name: Linux / Clang / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-asan
            variant: ASan [simdjson]
          - preset: linux-clang-static-asan-yyjson
            variant: ASan [yyjson]
          - preset: linux-clang-static-ubsan
            variant: UBSan [simdjson]
          - preset: linux-clang-static-ubsan-yyjson
            variant: UBSan [yyjson]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github/scripts/verify_submodules.sh extras/vcpkg extras/registry

      - name: Install system dependencies
        run: .github/scripts/install_deps_unix.sh clang

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-clang-san-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-clang-san-

      - name: Bootstrap vcpkg
        run: .github/scripts/bootstrap_vcpkg_unix.sh extras/vcpkg

      - name: Configure
        run: .github/scripts/configure_cmake.sh ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

  windows-msvc:
    name: Windows / MSVC / ${{ matrix.variant }}
    runs-on: windows-2022
    env:
      VCPKG_HOME: ${{ github.workspace }}\extras\vcpkg
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\extras\registry\ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\extras\registry\triplets
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-msvc-static-debug
            variant: static-debug [simdjson]
          - preset: windows-msvc-static-debug-yyjson
            variant: static-debug [yyjson]
          - preset: windows-msvc-static-release
            variant: static-release [simdjson]
          - preset: windows-msvc-static-release-yyjson
            variant: static-release [yyjson]
          - preset: windows-msvc-shared-debug
            variant: shared-debug [simdjson]
          - preset: windows-msvc-shared-debug-yyjson
            variant: shared-debug [yyjson]
          - preset: windows-msvc-shared-release
            variant: shared-release [simdjson]
          - preset: windows-msvc-shared-release-yyjson
            variant: shared-release [yyjson]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github\scripts\verify_submodules.ps1 extras/vcpkg extras/registry
        shell: pwsh

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-windows-msvc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-msvc-

      - name: Bootstrap vcpkg
        run: .github\scripts\bootstrap_vcpkg_windows.ps1 extras\vcpkg
        shell: pwsh

      - name: Configure
        run: .github\scripts\configure_cmake.ps1 -Preset ${{ matrix.preset }}
        shell: pwsh

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        shell: cmd

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out\build --output-on-failure
        shell: cmd
