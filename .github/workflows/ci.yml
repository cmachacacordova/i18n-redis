name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PROJECT_ROOT: ${{ github.workspace }}
  BUILD_DIR: ${{ github.workspace }}/out/build
  VCPKG_HOME: ${{ github.workspace }}/external/vcpkg

jobs:
  linux-gcc:
    name: Linux / GCC / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc-static-debug
            variant: static-debug
          - preset: linux-gcc-static-release
            variant: static-release
          - preset: linux-gcc-shared-debug
            variant: shared-debug
          - preset: linux-gcc-shared-release
            variant: shared-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc g++ cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: external/vcpkg
          key: vcpkg-linux-gcc-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-gcc-

      - name: Install vcpkg
        run: ./scripts/install_vcpkg.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build out/build --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

  linux-clang:
    name: Linux / Clang / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-debug
            variant: static-debug
          - preset: linux-clang-static-release
            variant: static-release
          - preset: linux-clang-shared-debug
            variant: shared-debug
          - preset: linux-clang-shared-release
            variant: shared-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: external/vcpkg
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-clang-

      - name: Install vcpkg
        run: ./scripts/install_vcpkg.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build out/build --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

  linux-clang-sanitizers:
    name: Linux / Clang / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-asan
            variant: ASan
          - preset: linux-clang-static-ubsan
            variant: UBSan

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: external/vcpkg
          key: vcpkg-linux-clang-san-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-clang-san-

      - name: Install vcpkg
        run: ./scripts/install_vcpkg.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build out/build --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

  windows-msvc:
    name: Windows / MSVC / ${{ matrix.variant }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-msvc-static-debug
            variant: static-debug
          - preset: windows-msvc-static-release
            variant: static-release
          - preset: windows-msvc-shared-debug
            variant: shared-debug
          - preset: windows-msvc-shared-release
            variant: shared-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: external/vcpkg
          key: vcpkg-windows-msvc-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-msvc-

      - name: Install vcpkg
        run: scripts\install_vcpkg.bat
        shell: cmd

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        shell: cmd

      - name: Build
        run: cmake --build out\build --parallel
        shell: cmd

      - name: Test
        run: ctest --test-dir out\build --output-on-failure
        shell: cmd
