name: Release

on:
  push:
    tags:
      - '*-SNAPSHOT'
      - '*-RELEASE'

env:
  VCPKG_HOME: ${{ github.workspace }}/extras/vcpkg
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extras/registry/ports
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extras/registry/triplets

jobs:
  # Build and test on Linux GCC (validation only)
  build-linux-gcc:
    name: Linux / GCC / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc-static-release
            variant: static-release-simdjson
          - preset: linux-gcc-static-release-yyjson
            variant: static-release-yyjson
          - preset: linux-gcc-shared-release
            variant: shared-release-simdjson
          - preset: linux-gcc-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github/scripts/verify_submodules.sh extras/vcpkg extras/registry

      - name: Install system dependencies
        run: .github/scripts/install_deps_unix.sh gcc

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-gcc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-gcc-

      - name: Bootstrap vcpkg
        run: .github/scripts/bootstrap_vcpkg_unix.sh extras/vcpkg

      - name: Configure
        run: .github/scripts/configure_cmake.sh ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out/build --output-on-failure

  # Build and test on Linux Clang (validation only)
  build-linux-clang:
    name: Linux / Clang / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-release
            variant: static-release-simdjson
          - preset: linux-clang-static-release-yyjson
            variant: static-release-yyjson
          - preset: linux-clang-shared-release
            variant: shared-release-simdjson
          - preset: linux-clang-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github/scripts/verify_submodules.sh extras/vcpkg extras/registry

      - name: Install system dependencies
        run: .github/scripts/install_deps_unix.sh clang

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-clang-

      - name: Bootstrap vcpkg
        run: .github/scripts/bootstrap_vcpkg_unix.sh extras/vcpkg

      - name: Configure
        run: .github/scripts/configure_cmake.sh ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out/build --output-on-failure

  # Build and test on Windows MSVC (validation only)
  build-windows-msvc:
    name: Windows / MSVC / ${{ matrix.variant }}
    runs-on: windows-2022
    env:
      VCPKG_HOME: ${{ github.workspace }}\extras\vcpkg
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\extras\registry\ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\extras\registry\triplets
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-msvc-static-release
            variant: static-release-simdjson
          - preset: windows-msvc-static-release-yyjson
            variant: static-release-yyjson
          - preset: windows-msvc-shared-release
            variant: shared-release-simdjson
          - preset: windows-msvc-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github\scripts\verify_submodules.ps1 extras/vcpkg extras/registry
        shell: pwsh

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-windows-msvc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-msvc-

      - name: Bootstrap vcpkg
        run: .github\scripts\bootstrap_vcpkg_windows.ps1 extras\vcpkg
        shell: pwsh

      - name: Configure
        run: .github\scripts\configure_cmake.ps1 -Preset ${{ matrix.preset }}
        shell: pwsh

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        shell: cmd

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out\build --output-on-failure
        shell: cmd

  # Create source package (contains everything needed to build on Unix and Windows)
  create-source-package:
    name: Create Source Package
    runs-on: ubuntu-24.04
    needs: [build-linux-gcc, build-linux-clang, build-windows-msvc]

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: sudo apt-get install -y --no-install-recommends tar gzip

      - name: Create source package
        run: |
          chmod +x .github/scripts/package_release.sh
          .github/scripts/package_release.sh source ${{ github.workspace }}/release

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: i18n-redis-source
          path: release/*.tar.gz
          if-no-files-found: error

  # Create GitHub Release with source package
  create-release:
    name: Create GitHub Release
    needs: [create-source-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download source package
        uses: actions/download-artifact@v4
        with:
          name: i18n-redis-source
          path: release

      - name: List release files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'SNAPSHOT') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
