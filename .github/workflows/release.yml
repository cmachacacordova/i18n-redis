name: Release

on:
  push:
    tags:
      - '*-SNAPSHOT'
      - '*-RELEASE'

env:
  VCPKG_HOME: ${{ github.workspace }}/extras/vcpkg

jobs:
  build-linux-gcc:
    name: Linux / GCC / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc-static-release
            variant: static-release-simdjson
          - preset: linux-gcc-static-release-yyjson
            variant: static-release-yyjson
          - preset: linux-gcc-shared-release
            variant: shared-release-simdjson
          - preset: linux-gcc-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: |
          FAILED=0
          for path in extras/vcpkg extras/registry; do
            if [ ! -d "$path" ] || [ -z "$(ls -A "$path")" ]; then
              echo "ERROR: submodule '$path' is missing or empty."
              FAILED=1
            else
              echo "OK: $path"
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc g++ cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-gcc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-gcc-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -f extras/vcpkg/vcpkg ]; then
            extras/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

      - name: Install
        run: cmake --install out/build --prefix out/install/${{ matrix.variant }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-gcc-${{ matrix.variant }}
          path: out/install/${{ matrix.variant }}/
          if-no-files-found: error

  build-linux-clang:
    name: Linux / Clang / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-release
            variant: static-release-simdjson
          - preset: linux-clang-static-release-yyjson
            variant: static-release-yyjson
          - preset: linux-clang-shared-release
            variant: shared-release-simdjson
          - preset: linux-clang-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: |
          FAILED=0
          for path in extras/vcpkg extras/registry; do
            if [ ! -d "$path" ] || [ -z "$(ls -A "$path")" ]; then
              echo "ERROR: submodule '$path' is missing or empty."
              FAILED=1
            else
              echo "OK: $path"
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-clang-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -f extras/vcpkg/vcpkg ]; then
            extras/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

      - name: Install
        run: cmake --install out/build --prefix out/install/${{ matrix.variant }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-clang-${{ matrix.variant }}
          path: out/install/${{ matrix.variant }}/
          if-no-files-found: error

  build-windows-msvc:
    name: Windows / MSVC / ${{ matrix.variant }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-msvc-static-release
            variant: static-release-simdjson
          - preset: windows-msvc-static-release-yyjson
            variant: static-release-yyjson
          - preset: windows-msvc-shared-release
            variant: shared-release-simdjson
          - preset: windows-msvc-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: |
          $failed = $false
          foreach ($path in @("extras/vcpkg", "extras/registry")) {
            if (-not (Test-Path $path) -or (Get-ChildItem $path).Count -eq 0) {
              Write-Error "ERROR: submodule '$path' is missing or empty."
              $failed = $true
            } else {
              Write-Host "OK: $path"
            }
          }
          if ($failed) { exit 1 }
        shell: pwsh

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-windows-msvc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-msvc-

      - name: Bootstrap vcpkg
        run: |
          if (-not (Test-Path "extras\vcpkg\vcpkg.exe")) {
            & "extras\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          }
        shell: pwsh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        shell: cmd

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        shell: cmd

      - name: Test
        run: ctest --test-dir out\build --output-on-failure
        shell: cmd

      - name: Install
        run: cmake --install out\build --prefix out\install\${{ matrix.variant }}
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-${{ matrix.variant }}
          path: out\install\${{ matrix.variant }}\
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-linux-gcc, build-linux-clang, build-windows-msvc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [[ "$name" == windows-* ]]; then
              (cd "$dir" && zip -r "$GITHUB_WORKSPACE/release/${name}.zip" .)
            else
              tar -czf "release/${name}.tar.gz" -C "$dir" .
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.tar.gz
            release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'SNAPSHOT') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
