name: Release

on:
  push:
    tags:
      - '*-SNAPSHOT'
      - '*-RELEASE'

env:
  PROJECT_ROOT: ${{ github.workspace }}
  BUILD_DIR: ${{ github.workspace }}/out/build
  VCPKG_HOME: ${{ github.workspace }}/external/vcpkg

jobs:
  build-linux-gcc:
    name: Linux / GCC / Release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc-static-release
            variant: static-release
          - preset: linux-gcc-shared-release
            variant: shared-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update custom vcpkg registry submodule
        run: |
          git submodule update --remote vcpkg
          git -C vcpkg fetch origin vcpkg
          git -C vcpkg checkout origin/vcpkg

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc g++ cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: external/vcpkg
          key: vcpkg-linux-gcc-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-gcc-

      - name: Install vcpkg
        run: ./scripts/install_vcpkg.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build out/build --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

      - name: Install
        run: cmake --install out/build --prefix out/install/${{ matrix.variant }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-gcc-${{ matrix.variant }}
          path: out/install/${{ matrix.variant }}/
          if-no-files-found: error

  build-linux-clang:
    name: Linux / Clang / Release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-release
            variant: static-release
          - preset: linux-clang-shared-release
            variant: shared-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update custom vcpkg registry submodule
        run: |
          git submodule update --remote vcpkg
          git -C vcpkg fetch origin vcpkg
          git -C vcpkg checkout origin/vcpkg

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: external/vcpkg
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-clang-

      - name: Install vcpkg
        run: ./scripts/install_vcpkg.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build out/build --parallel

      - name: Test
        run: ctest --test-dir out/build --output-on-failure

      - name: Install
        run: cmake --install out/build --prefix out/install/${{ matrix.variant }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-clang-${{ matrix.variant }}
          path: out/install/${{ matrix.variant }}/
          if-no-files-found: error

  build-windows-msvc:
    name: Windows / MSVC / Release
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-msvc-static-release
            variant: static-release
          - preset: windows-msvc-shared-release
            variant: shared-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update custom vcpkg registry submodule
        run: |
          git submodule update --remote vcpkg
          git -C vcpkg fetch origin vcpkg
          git -C vcpkg checkout origin/vcpkg

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: external/vcpkg
          key: vcpkg-windows-msvc-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-msvc-

      - name: Install vcpkg
        run: scripts\install_vcpkg.bat
        shell: cmd

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        shell: cmd

      - name: Build
        run: cmake --build out\build --parallel
        shell: cmd

      - name: Test
        run: ctest --test-dir out\build --output-on-failure
        shell: cmd

      - name: Install
        run: cmake --install out\build --prefix out\install\${{ matrix.variant }}
        shell: cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-${{ matrix.variant }}
          path: out\install\${{ matrix.variant }}\
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-linux-gcc, build-linux-clang, build-windows-msvc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -czf "release/${name}.tar.gz" -C "$dir" .
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'SNAPSHOT') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
