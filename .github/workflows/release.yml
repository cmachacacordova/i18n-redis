name: Release

on:
  push:
    tags:
      - '*-SNAPSHOT'
      - '*-RELEASE'

env:
  VCPKG_HOME: ${{ github.workspace }}/extras/vcpkg
  VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extras/registry/ports
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extras/registry/triplets

jobs:
  # Build and test on Linux GCC - NO artifacts uploaded (only validation)
  build-linux-gcc:
    name: Linux / GCC / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc-static-release
            variant: static-release-simdjson
          - preset: linux-gcc-static-release-yyjson
            variant: static-release-yyjson
          - preset: linux-gcc-shared-release
            variant: shared-release-simdjson
          - preset: linux-gcc-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github/scripts/verify_submodules.sh extras/vcpkg extras/registry

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build gcc g++ cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-gcc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-gcc-

      - name: Bootstrap vcpkg
        run: .github/scripts/bootstrap_vcpkg_unix.sh extras/vcpkg

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS" -DVCPKG_OVERLAY_PORTS="$VCPKG_OVERLAY_PORTS"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out/build --output-on-failure

  # Build and test on Linux Clang - NO artifacts uploaded (only validation)
  build-linux-clang:
    name: Linux / Clang / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-static-release
            variant: static-release-simdjson
          - preset: linux-clang-static-release-yyjson
            variant: static-release-yyjson
          - preset: linux-clang-shared-release
            variant: shared-release-simdjson
          - preset: linux-clang-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github/scripts/verify_submodules.sh extras/vcpkg extras/registry

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang cmake curl zip unzip tar pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-clang-

      - name: Bootstrap vcpkg
        run: .github/scripts/bootstrap_vcpkg_unix.sh extras/vcpkg

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_OVERLAY_TRIPLETS="$VCPKG_OVERLAY_TRIPLETS" -DVCPKG_OVERLAY_PORTS="$VCPKG_OVERLAY_PORTS"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out/build --output-on-failure

  # Build on Windows MSVC - Upload binary artifacts
  build-windows-msvc:
    name: Windows / MSVC / ${{ matrix.variant }}
    runs-on: windows-2022
    env:
      VCPKG_HOME: ${{ github.workspace }}\extras\vcpkg
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\extras\registry\ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\extras\registry\triplets
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-msvc-static-release
            variant: static-release-simdjson
          - preset: windows-msvc-static-release-yyjson
            variant: static-release-yyjson
          - preset: windows-msvc-shared-release
            variant: shared-release-simdjson
          - preset: windows-msvc-shared-release-yyjson
            variant: shared-release-yyjson

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules were populated
        run: .github\scripts\verify_submodules.ps1 extras/vcpkg extras/registry
        shell: pwsh

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: extras/vcpkg
          key: vcpkg-windows-msvc-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-msvc-

      - name: Bootstrap vcpkg
        run: .github\scripts\bootstrap_vcpkg_windows.ps1 extras\vcpkg
        shell: pwsh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_OVERLAY_TRIPLETS="%VCPKG_OVERLAY_TRIPLETS%" -DVCPKG_OVERLAY_PORTS="%VCPKG_OVERLAY_PORTS%"
        shell: cmd

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
        shell: cmd

      - name: Test
        if: ${{ !contains(matrix.preset, 'shared') }}
        run: ctest --test-dir out\build --output-on-failure
        shell: cmd

      - name: Install
        run: cmake --install out\build --prefix out\install\${{ matrix.variant }}
        shell: cmd

      - name: Create binary package with headers and config
        run: |
          .github\scripts\package_windows.ps1 -Variant "${{ matrix.variant }}" -OutputDir "release" -InstallDir "out\install"
        shell: pwsh

      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc-${{ matrix.variant }}
          path: release/*.zip
          if-no-files-found: error

  # Create source package for Unix (source code only, no compiled artifacts)
  create-source-package:
    name: Create Unix Source Package
    runs-on: ubuntu-24.04
    needs: [build-linux-gcc, build-linux-clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: sudo apt-get install -y --no-install-recommends tar gzip

      - name: Create and validate source package
        run: |
          chmod +x .github/scripts/package_release.sh
          .github/scripts/package_release.sh source ${{ github.workspace }}/release

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: i18n-redis-source
          path: release/*.tar.gz
          if-no-files-found: error

  # Create release with all packages
  create-release:
    name: Create GitHub Release
    needs: [create-source-package, build-windows-msvc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"

      - name: Organize release files
        run: |
          mkdir -p release

          # Move source package
          if [ -f "artifacts/i18n-redis-source/"*.tar.gz ]; then
            cp artifacts/i18n-redis-source/*.tar.gz release/
          fi

          # Move Windows binary packages
          for dir in artifacts/windows-msvc-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.zip release/ 2>/dev/null || true
            fi
          done

          echo "Release files:"
          ls -la release/

      - name: Validate packages
        run: |
          echo "[RELEASE] Validating release packages..."

          # Re-download and run validation script on source packages
          for pkg in release/*.tar.gz; do
            if [ -f "$pkg" ]; then
              echo "[RELEASE] Checking source package: $pkg"
              # Verify no excluded files
              if tar -tzf "$pkg" | grep -qE "(\.vscode/|\.windsurf/|\.github/|out/|vcpkg_installed/|extras/registry)"; then
                echo "[RELEASE] ERROR: Found excluded directories in $pkg"
                tar -tzf "$pkg" | grep -E "(\.vscode/|\.windsurf/|\.github/|out/|vcpkg_installed/|extras/registry)"
                exit 1
              fi
              # Verify configure script exists
              if ! tar -tzf "$pkg" | grep -qE "configure$"; then
                echo "[RELEASE] ERROR: configure script not found in $pkg"
                exit 1
              fi
              echo "[RELEASE] Source package validation: PASSED"
            fi
          done

          for pkg in release/*.zip; do
            if [ -f "$pkg" ]; then
              echo "[RELEASE] Checking binary package: $pkg"
              # Verify it has binary files
              if ! unzip -l "$pkg" 2>/dev/null | grep -qE "\.(lib|dll|exe)$"; then
                echo "[RELEASE] ERROR: No binary files (.lib, .dll, .exe) found in $pkg"
                exit 1
              fi
              if unzip -l "$pkg" 2>/dev/null | grep -qE "(src/.*\.cpp$|extras/registry|\.github/|vcpkg_installed/|out/|CMakeLists\.txt|CMakePresets\.json|vcpkg\.json|vcpkg-configuration\.json)"; then
                echo "[RELEASE] ERROR: Found source or internal build files in $pkg"
                unzip -l "$pkg" 2>/dev/null | grep -E "(src/.*\.cpp$|extras/registry|\.github/|vcpkg_installed/|out/|CMakeLists\.txt|CMakePresets\.json|vcpkg\.json|vcpkg-configuration\.json)"
                exit 1
              fi
              echo "[RELEASE] Binary package validation: PASSED"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.tar.gz
            release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'SNAPSHOT') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
