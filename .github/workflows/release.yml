name: Release

on:
  push:
    tags:
      - '*-SNAPSHOT'
      - '*-RELEASE'

jobs:
  package-unix:
    name: Package Unix Source
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source package
        run: |
          chmod +x .github/scripts/package_source_unix.sh
          .github/scripts/package_source_unix.sh ${{ github.workspace }}/release

      - name: Install system dependencies for validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git

      - name: Clone vcpkg and registry for validation
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg.git validation/vcpkg
          git clone --depth=1 -b vcpkg https://github.com/cmachacacordova/vcpkg-registry.git validation/registry

      - name: Validate package compiles
        timeout-minutes: 30
        env:
          VCPKG_HOME: ${{ github.workspace }}/validation/vcpkg
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/validation/registry/ports
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/validation/registry/triplets
        run: |
          mkdir -p validation/build
          tar -xzf release/*.tar.gz -C validation/build
          extracted_dir=$(find validation/build -maxdepth 1 -type d -name "i18n-redis-*" | head -1)
          echo "Extracted directory: $extracted_dir"
          cd "$extracted_dir"
          ./configure --preset linux-gcc-static-release --use-vcpkg --configure-only -- -DVCPKG_OVERLAY_PORTS=$VCPKG_OVERLAY_PORTS -DVCPKG_OVERLAY_TRIPLETS=$VCPKG_OVERLAY_TRIPLETS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-redis-unix
          path: release/*.tar.gz
          if-no-files-found: error

  package-windows:
    name: Package Windows Source
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source package
        shell: pwsh
        run: |
          .github/scripts/package_source_windows.ps1 ${{ github.workspace }}\release

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Clone vcpkg and registry for validation
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg.git validation/vcpkg
          git clone --depth=1 -b vcpkg https://github.com/cmachacacordova/vcpkg-registry.git validation/registry

      - name: Validate package compiles
        timeout-minutes: 30
        shell: pwsh
        env:
          VCPKG_HOME: ${{ github.workspace }}\validation\vcpkg
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\validation\registry\ports
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\validation\registry\triplets
        run: |
          New-Item -ItemType Directory -Force -Path validation/build | Out-Null
          $zipFile = Get-ChildItem -Path release -Filter *.zip | Select-Object -First 1 -ExpandProperty FullName
          Expand-Archive -Path $zipFile -DestinationPath validation/build
          $extractedDir = Get-ChildItem -Path validation/build -Directory | Select-Object -First 1
          Write-Host "Extracted directory: $($extractedDir.FullName)"
          Set-Location $extractedDir.FullName
          Unblock-File -Path .\configure.ps1
          .\configure.ps1 -Preset windows-msvc-static-release -UseVcpkg -ConfigureOnly -CmakeArgs "-DVCPKG_OVERLAY_PORTS=$env:VCPKG_OVERLAY_PORTS","-DVCPKG_OVERLAY_TRIPLETS=$env:VCPKG_OVERLAY_TRIPLETS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-redis-windows
          path: release/*.zip
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [package-unix, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ endsWith(github.ref_name, '-SNAPSHOT') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
